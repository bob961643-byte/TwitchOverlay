<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twitch Overlay</title>

    <style>


        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: transparent;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            pointer-events: none;
        }

        #chat {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 5px;
            pointer-events: none;
            overflow: hidden;
        }

        /* В режиме редактирования чат принимает мышь. */
/* =========================
           СООБЩЕНИЕ
        ========================= */

        .message {

            width: fit-content;

            max-width: 100%;

            padding: 2px 0;

            color: #ffffff;

           font-size: var(--chat-font-size, 20px);

            line-height: 1.45;

            word-break: break-word;

            overflow-wrap: anywhere;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.95),
                1px 0 2px rgba(0, 0, 0, 0.9),
                -1px 0 2px rgba(0, 0, 0, 0.9),
                0 -1px 2px rgba(0, 0, 0, 0.9);

            animation:
                messageIn
                0.18s
                ease-out;
        }


        /* =========================
           BADGES
        ========================= */

        .badges {

            display: inline-flex;

            align-items: center;

            vertical-align: middle;

            margin-right: 6px;

            gap: 3px;

            height: 22px;
        }


        .badge {

            display: inline-block;

            width: 20px;
            height: 20px;

            min-width: 20px;

            object-fit: contain;

            vertical-align: middle;
        }


        /* =========================
           ИМЯ
        ========================= */

        .username {

            display: inline;

            font-weight: var(--username-weight, 700);

            margin-right: 5px;

            white-space: nowrap;

            color: var(--username-color, #ffffff);

            font-style: var(--username-style, normal);
        }


        /* =========================
           TWITCH EMOTE
        ========================= */

        .emote {

            display: inline-block;

            width: auto;

            height: 30px;

            max-width: 120px;

            object-fit: contain;

            vertical-align: middle;

            margin:
                -5px 2px
                -6px 2px;
        }


        .message-content {

            display: inline;
        }


        @keyframes messageIn {

            from {
                opacity: 0;
                transform:
                    translateY(8px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        .message.removing {

            opacity: 0;

            transform:
                translateY(-5px);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

    
       body.overlay-editing {
    pointer-events: auto;

    cursor: move;

    box-shadow:
        inset 0 0 0 2px
        rgba(255, 255, 255, 0.55);
}

        body.overlay-editing #chat {
            pointer-events: none;
        }

        /* =========================
   RESIZE HANDLES
========================= */

.resize-handle {
    position: fixed;

    display: none;

    width: 12px;
    height: 12px;

    z-index: 999999;

    pointer-events: auto;

    box-sizing: border-box;

    background: #ffffff;

    border: 2px solid #151820;

    border-radius: 3px;
}


/* Показываем только при редактировании */

body.overlay-editing .resize-handle {
    display: block;
}


/* =========================
   СТОРОНЫ
========================= */

.resize-n {
    top: 0;
    left: 50%;

    transform: translateX(-50%);

    cursor: ns-resize;
}


.resize-s {
    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    cursor: ns-resize;
}


.resize-e {
    right: 0;
    top: 50%;

    transform: translateY(-50%);

    cursor: ew-resize;
}


.resize-w {
    left: 0;
    top: 50%;

    transform: translateY(-50%);

    cursor: ew-resize;
}


/* =========================
   УГЛЫ
========================= */

.resize-ne {
    top: 0;
    right: 0;

    cursor: nesw-resize;
}


.resize-nw {
    top: 0;
    left: 0;

    cursor: nwse-resize;
}


.resize-se {
    right: 0;
    bottom: 0;

    cursor: nwse-resize;
}


.resize-sw {
    left: 0;
    bottom: 0;

    cursor: nesw-resize;
}



        /* =========================
           РЕЖИМ РЕДАКТИРОВАНИЯ
        ========================= */

        body.overlay-editing {
            pointer-events: auto;
            cursor: move;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55);
        }

        body.overlay-editing #chat { pointer-events: none; }

        .resize-handle {
            position: fixed;
            display: none;
            width: 12px;
            height: 12px;
            z-index: 999999;
            pointer-events: auto;
            box-sizing: border-box;
            background: #ffffff;
            border: 2px solid #151820;
            border-radius: 3px;
        }

        body.overlay-editing .resize-handle { display: block; }

        .resize-n { top: 0; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .resize-s { bottom: 0; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .resize-e { right: 0; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        .resize-w { left: 0; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        .resize-ne { top: 0; right: 0; cursor: nesw-resize; }
        .resize-nw { top: 0; left: 0; cursor: nwse-resize; }
        .resize-se { right: 0; bottom: 0; cursor: nwse-resize; }
        .resize-sw { left: 0; bottom: 0; cursor: nesw-resize; }

    </style>

</head>


<body>

    <div id="chat"></div>


    <div class="resize-handle resize-n" data-resize="n"></div>
    <div class="resize-handle resize-s" data-resize="s"></div>
    <div class="resize-handle resize-e" data-resize="e"></div>
    <div class="resize-handle resize-w" data-resize="w"></div>
    <div class="resize-handle resize-ne" data-resize="ne"></div>
    <div class="resize-handle resize-nw" data-resize="nw"></div>
    <div class="resize-handle resize-se" data-resize="se"></div>
    <div class="resize-handle resize-sw" data-resize="sw"></div>
    <script>

const chat =
    document.getElementById("chat");

let resizeDirection =
    "";

let overlayEditing =
    false;

let isDragging =
    false;

let isResizing =
    false;

let dragStartX =
    0;

let dragStartY =
    0;

let overlaySettings = {
    fontSize: 20,
    opacity: 85,
    maxMessages: 10,
    messageDuration: 30,
    usernameColor: "#ffffff",
    usernameStyle: "bold",
    chatHorizontal: "left",
    chatVertical: "top"
};


function applyOverlaySettings(settings) {

    if (!settings || typeof settings !== "object") {
        return;
    }

    overlaySettings = {
        ...overlaySettings,
        ...settings
    };

    const fontSize =
        Math.max(
            10,
            Math.min(
                100,
                Number(overlaySettings.fontSize) || 20
            )
        );

    document.documentElement.style.setProperty(
        "--chat-font-size",
        `${fontSize}px`
    );

    const horizontal =
        ["left", "center", "right"].includes(
            overlaySettings.chatHorizontal
        )
            ? overlaySettings.chatHorizontal
            : "left";

    const vertical =
        ["top", "center", "bottom"].includes(
            overlaySettings.chatVertical
        )
            ? overlaySettings.chatVertical
            : "top";

    chat.style.justifyContent =
        vertical === "top"
            ? "flex-start"
            : vertical === "center"
                ? "center"
                : "flex-end";

    chat.style.alignItems =
        horizontal === "left"
            ? "flex-start"
            : horizontal === "center"
                ? "center"
                : "flex-end";

    const color =
        /^#[0-9a-fA-F]{6}$/.test(
            String(overlaySettings.usernameColor)
        )
            ? String(overlaySettings.usernameColor)
            : "#ffffff";

    document.documentElement.style.setProperty(
        "--username-color",
        color
    );

    const style =
        String(overlaySettings.usernameStyle);

    document.documentElement.style.setProperty(
        "--username-weight",
        style.includes("bold")
            ? "700"
            : "400"
    );

    document.documentElement.style.setProperty(
        "--username-style",
        style.includes("italic")
            ? "italic"
            : "normal"
    );

}


if (
    window.overlayAPI &&
    typeof window.overlayAPI.onSettings ===
    "function"
) {

    window.overlayAPI.onSettings(
        applyOverlaySettings
    );

}


if (
    window.overlayAPI &&
    typeof window.overlayAPI.onMessage ===
    "function"
) {

    window.overlayAPI.onMessage(
        (message) => {

            addMessage(message);

        }
    );

}


if (
    window.overlayAPI &&
    typeof window.overlayAPI.onEditMode ===
    "function"
) {
/* =========================
   РАЗМЕР ТЕКСТА ЧАТА
========================= */

if (
    window.overlayAPI &&
    typeof window.overlayAPI.onChatFontSize ===
    "function"
) {

    window.overlayAPI.onChatFontSize(
        (size) => {

            const fontSize =
                Math.max(
                    10,
                    Math.min(
                        100,
                        Number(size) || 20
                    )
                );

            document.documentElement.style.setProperty(
                "--chat-font-size",
                `${fontSize}px`
            );

        }
    );

}
    window.overlayAPI.onEditMode(
        (enabled) => {

            overlayEditing =
                Boolean(enabled);


            if (overlayEditing) {

                document.body.classList.add(
                    "overlay-editing"
                );

            } else {

                document.body.classList.remove(
                    "overlay-editing"
                );

                isDragging =
                    false;

                isResizing =
                    false;

            }

        }
    );

}


/* =========================
   ПЕРЕМЕЩЕНИЕ И РАЗМЕР OVERLAY
========================= */

document.addEventListener(
    "mousedown",
    (event) => {

        if (
            !overlayEditing ||
            event.button !== 0
        ) {
            return;
        }

        const handle =
            event.target.closest(
                ".resize-handle"
            );

        if (handle) {
            isResizing = true;
            isDragging = false;
            resizeDirection =
                handle.dataset.resize || "";
        } else {
            isDragging = true;
            isResizing = false;
            resizeDirection = "";
        }

        dragStartX = event.screenX;
        dragStartY = event.screenY;

        event.preventDefault();
    }
);

document.addEventListener(
    "mousemove",
    (event) => {

        if (!overlayEditing) {
            return;
        }

        const deltaX =
            event.screenX - dragStartX;
        const deltaY =
            event.screenY - dragStartY;

        if (deltaX === 0 && deltaY === 0) {
            return;
        }

        if (isResizing) {
            window.overlayAPI?.resize?.(
                resizeDirection,
                deltaX,
                deltaY
            );
        } else if (isDragging) {
            window.overlayAPI?.move?.(
                deltaX,
                deltaY
            );
        }

        dragStartX = event.screenX;
        dragStartY = event.screenY;
    }
);

function stopPointerAction() {
    isDragging = false;
    isResizing = false;
    resizeDirection = "";
}

document.addEventListener(
    "mouseup",
    stopPointerAction
);

document.addEventListener(
    "mouseleave",
    stopPointerAction
);

document.addEventListener(
    "keydown",
    (event) => {
        if (
            event.key === "Escape" &&
            overlayEditing
        ) {
            window.overlayAPI?.stopEditMode?.();
        }
    }
);


function createBadge(
    name,
    version,
    imageUrl
) {

    const badge =
        document.createElement("img");

    badge.className =
        "badge";

    badge.alt =
        name;

    badge.title =
        name;

    badge.src =
        imageUrl ||
        `https://static-cdn.jtvnw.net/badges/v1/${encodeURIComponent(name)}/${encodeURIComponent(version)}/2`;

    badge.onerror = () => {

        if (
            badge.dataset.fallback !== "1"
        ) {

            badge.dataset.fallback =
                "1";

            badge.src =
                `https://static-cdn.jtvnw.net/badges/v1/${encodeURIComponent(name)}/${encodeURIComponent(version)}/1`;

        } else {

            badge.remove();

        }

    };

    return badge;

}


function addMessage(message) {

    if (!message || !chat) {
        return;
    }

    const messageElement =
        document.createElement("div");

    messageElement.className =
        "message";

    const messageId = String(message.messageId || "").trim();
    const userId = String(message.userId || "").trim();
    const usernameKey = String(message.username || "").trim().toLowerCase();
    if (messageId) messageElement.dataset.messageId = messageId;
    if (userId) messageElement.dataset.userId = userId;
    if (usernameKey) messageElement.dataset.username = usernameKey;

    if (
        message.badges &&
        Object.keys(message.badges).length
    ) {

        const badges =
            document.createElement("span");

        badges.className =
            "badges";

        for (
            const [
                badgeName,
                badgeVersion
            ]
            of Object.entries(
                message.badges
            )
        ) {

            const badge =
                createBadge(
                    badgeName,
                    badgeVersion,
                    message.badgeImages
                        ?.[badgeName]
                );

            badges.appendChild(
                badge
            );

        }

        if (badges.children.length) {

            messageElement.appendChild(
                badges
            );

        }

    }

    const username =
        document.createElement("span");

    username.className =
        "username";

    username.textContent =
        message.username ||
        "Unknown";

    const twitchColor =
        /^(?:#[0-9a-fA-F]{6}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(?:\s*,\s*(?:0|1|0?\.\d+))?\s*\))$/i.test(String(message.color || ""))
            ? String(message.color)
            : null;

    username.style.color =
        overlaySettings.useTwitchUsernameColor !== false && twitchColor
            ? twitchColor
            : (overlaySettings.usernameColor || "#ffffff");

    messageElement.appendChild(
        username
    );

    messageElement.appendChild(
        document.createTextNode(": ")
    );

    const content =
        document.createElement("span");

    content.className =
        "message-content";

    renderMessageContent(
        content,
        message
    );

    messageElement.appendChild(
        content
    );

    chat.appendChild(
        messageElement
    );

    while (
        chat.children.length >
        Math.max(
            1,
            Number(overlaySettings.maxMessages) || 10
        )
    ) {

        chat.firstChild.remove();

    }

    const timer =
        setTimeout(
            () => {
                removeMessage(
                    messageElement
                );
            },
            Math.max(
                1,
                Number(overlaySettings.messageDuration) || 30
            ) * 1000
        );

    messageElement._timer =
        timer;

}



function renderMessageContent(container, message) {
    const text = String(message?.message || "");
    if (!text) return;

    const replacements = [];

    // Native Twitch emotes use byte/character positions supplied by TMI.
    for (const [emoteId, positions] of Object.entries(message.emotes || {})) {
        for (const position of Array.isArray(positions) ? positions : []) {
            const parts = String(position).split("-");
            if (parts.length !== 2) continue;

            const start = Number(parts[0]);
            const end = Number(parts[1]);
            if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end < start) continue;

            replacements.push({
                start,
                end,
                id: emoteId,
                url: `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(emoteId)}/default/dark/3.0`,
                fallbackUrl: `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(emoteId)}/default/dark/2.0`,
                kind: "twitch"
            });
        }
    }

    // BTTV / 7TV replacements were already prepared by main.js, but the old
    // renderer ignored them. That made animated third-party emotes disappear.
    for (const replacement of Array.isArray(message.thirdPartyEmotes) ? message.thirdPartyEmotes : []) {
        const start = Number(replacement.start);
        const end = Number(replacement.end);
        const url = String(replacement.url || "").trim();
        if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end < start || !url) continue;

        replacements.push({
            start,
            end,
            id: replacement.id || replacement.name || "",
            url,
            kind: replacement.provider || "third-party"
        });
    }

    replacements.sort((a, b) => a.start - b.start || a.end - b.end);

    let cursor = 0;
    let emoteIndex = 0;

    for (const replacement of replacements) {
        if (replacement.start < cursor || replacement.start >= text.length) continue;

        if (replacement.start > cursor) {
            container.appendChild(
                document.createTextNode(text.substring(cursor, replacement.start))
            );
        }

        const emote = document.createElement("img");
        emote.className = "emote";
        emote.alt = text.substring(
            replacement.start,
            Math.min(text.length, replacement.end + 1)
        );
        emote.title = emote.alt;
        emote.loading = "eager";
        emote.decoding = "async";
        emote.dataset.emoteUrl = replacement.url;

        // GIF and animated WebP are handled natively by Chromium. Do not
        // convert them to canvas frames: keeping the original animated image
        // preserves timing and avoids a CPU-heavy animation loop.
        let url = replacement.url;
        if (/\.gif(?:$|[?#])/i.test(url)) {
            // A unique query prevents Chromium from reusing a partially
            // decoded animation when the same emote appears in multiple
            // messages at once.
            const separator = url.includes("?") ? "&" : "?";
            url += `${separator}twitchoverlay=${Date.now()}-${emoteIndex++}`;
        }

        emote.src = url;

        if (replacement.fallbackUrl) {
            emote.dataset.fallbackUrl = replacement.fallbackUrl;
        }

        emote.onerror = () => {
            const fallback = emote.dataset.fallbackUrl;
            if (fallback && emote.dataset.fallbackUsed !== "1") {
                emote.dataset.fallbackUsed = "1";
                emote.src = fallback;
                return;
            }

            const fallback2 = replacement.kind === "twitch"
                ? `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(replacement.id)}/default/dark/2.0`
                : "";

            if (fallback2 && emote.src !== fallback2) {
                emote.src = fallback2;
                return;
            }

            emote.replaceWith(document.createTextNode(emote.alt));
        };

        container.appendChild(emote);
        cursor = replacement.end + 1;
    }

    if (cursor < text.length) {
        container.appendChild(
            document.createTextNode(text.substring(cursor))
        );
    }
}

function removeMessage(
    element
) {

    if (
        !element ||
        !element.parentNode
    ) {

        return;

    }

    if (element._timer) {
        clearTimeout(element._timer);
        element._timer = null;
    }

    element.classList.add(
        "removing"
    );

    setTimeout(
        () => {

            if (element.parentNode) {
                element.querySelectorAll("img").forEach((img) => {
                    img.removeAttribute("src");
                    img.removeAttribute("srcset");
                });
                element.remove();
            }

        },
        250
    );

}


if (window.overlayAPI?.onMessageDeleted) {
    window.overlayAPI.onMessageDeleted((payload) => {
        const messageId = String(payload?.messageId || "").trim();
        const username = String(payload?.username || "").trim().toLowerCase();
        const userId = String(payload?.userId || "").trim();
        document.querySelectorAll("#chat .message").forEach((element) => {
            const sameMessage = messageId && element.dataset.messageId === messageId;
            const sameUser = payload?.removeUser && (
                (userId && element.dataset.userId === userId) ||
                (username && element.dataset.username === username)
            );
            if (sameMessage || sameUser) removeMessage(element);
        });
    });
}

if (window.overlayAPI?.onChatCleared) {
    window.overlayAPI.onChatCleared(() => {
        document.querySelectorAll("#chat .message").forEach(removeMessage);
    });
}

    </script>

</body>

</html>
